# docwright Integration for Aider
#
# Workflow:
#   1. Read the contract: docwright contract docs/features/<goal>/spec.md
#   2. Implement against the contract
#   3. Verify: docwright lifecycle docs/features/<goal>/spec.md --code . --format json
#   4. Guard: docwright guard --spec-dir docs --code .
#   5. Review: docwright explain docs/features/<goal>/spec.md --format markdown
#
# Key Commands:
#   docwright contract <spec>   - render Task Contract for planning
#   docwright lifecycle <spec>  - full lint + verify pipeline
#   docwright guard             - repo-wide pre-commit check
#   docwright explain <spec>    - human-readable review summary
#   docwright stamp <spec>      - preview git trailers (--dry-run)
#
# Retry Protocol:
#   When lifecycle fails, parse JSON output and fix code based on evidence.
#   Do NOT modify the spec file to make verification pass.
#   After 3 consecutive failures on the same scenario, escalate.
#
# Verdicts: pass, fail, skip, uncertain (skip != pass)
