# docwright Contract Guard — Minimal Version
#
# A simpler workflow that just runs guard and posts the result.
# Use this if you want the fastest possible setup.
#
# Copy to: .github/workflows/contract-guard.yml

name: Contract Guard

on: [pull_request]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --quiet

      - name: Cache docwright
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/docwright
          key: docwright-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install docwright
        run: |
          command -v docwright || cargo install --path . --bin docwright

      - name: Contract Guard
        run: docwright guard --spec-dir docs --code . --change-scope worktree

      - name: Contract Summary
        if: always()
        run: |
          while IFS= read -r spec; do
            [ -f "$spec" ] || continue
            echo "---"
            docwright explain "$spec" --code . --format markdown 2>/dev/null || true
          done < <(find docs -type d -name roadmap -prune -o -type f \( -name '*.spec' -o -name '*.spec.md' -o -name 'spec.md' \) -print) >> "$GITHUB_STEP_SUMMARY"
